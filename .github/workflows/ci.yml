name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python }}

      - name: Sync frozen dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run strict type checking
        run: uv run mypy src/

      - name: Run test suite with coverage
        run: uv run pytest --cov --cov-report=term-missing -ra
        env:
          PYTHONUNBUFFERED: "1"

  required:
    name: CI / Required
    if: always()
    needs:
      - quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that all required jobs succeeded
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ]; then
            echo "quality-gate result: ${{ needs.quality-gate.result }}"
            exit 1
          fi
          echo "All required jobs succeeded."
