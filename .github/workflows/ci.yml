name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (Python 3.12, windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.5.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync frozen dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run strict type checking
        run: uv run mypy src/

      - name: Run test suite with coverage
        run: uv run pytest --cov --cov-report=term-missing -ra
        env:
          PYTHONUNBUFFERED: "1"

  compatibility:
    name: Compatibility (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.5.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python }}

      - name: Sync frozen dependencies
        run: uv sync --frozen --group dev

      - name: Run test suite
        run: uv run pytest -ra
        env:
          PYTHONUNBUFFERED: "1"

  packaging:
    name: Packaging Smoke (Python 3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.5.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync frozen development dependencies
        run: uv sync --frozen --group dev

      - name: Build wheel and source distribution
        run: uv build --sdist --wheel --out-dir dist

      - name: Install and exercise each distribution
        run: uv run pytest -q tests/packaging/test_distribution_smoke.py
        env:
          HYBRID_SDLC_PACKAGING_DIST: dist

  required:
    name: CI / Required
    if: always()
    needs:
      - quality-gate
      - compatibility
      - packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that all required jobs succeeded
        env:
          QUALITY_GATE_RESULT: ${{ needs.quality-gate.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
        run: |
          if [ "$QUALITY_GATE_RESULT" != "success" ] || [ "$COMPATIBILITY_RESULT" != "success" ] || [ "$PACKAGING_RESULT" != "success" ]; then
            echo "quality-gate result: $QUALITY_GATE_RESULT"
            echo "compatibility result: $COMPATIBILITY_RESULT"
            echo "packaging result: $PACKAGING_RESULT"
            exit 1
          fi
          echo "All required jobs succeeded."
